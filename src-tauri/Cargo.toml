[package]
name = "focusanalyze-desktop"
version = "0.1.1"
description = "FocusAnalyze desktop system analytics and focus tracking"
authors = ["DGK Software Solution"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["default", "devtools", "tray-icon", "macos-private-api"] }
tauri-plugin-log = "2.8"
tauri-plugin-process = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.9"
tiny_http = "0.12"
http = "1"
urlencoding = "2.1"
ureq = { version = "2.12", features = ["json"] }
sysinfo = "0.33.0"
csv = "1.1.6"
x-win = "3.0.0"
tauri-plugin-notification = "2"
